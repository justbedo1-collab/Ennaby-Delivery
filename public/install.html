<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تثبيت تطبيق الرجل العنابي دليفرى</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7B3F52">

  <!-- استدعاء خط Cairo من Google Fonts بأوزان مختلفة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Cairo', sans-serif !important; 
    }
    body {
      background: #FAF7F4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(123, 63, 82, 0.12);
      border: 1px solid #F0EAE1;
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 22px;
      margin: 0 auto 20px;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(123, 63, 82, 0.18);
    }
    h1 { 
      color: #7B3F52; 
      font-size: 23px; 
      font-weight: 800;
      margin-bottom: 12px; 
    }
    p { 
      color: #555; 
      font-size: 15px; 
      line-height: 1.7; 
      margin-bottom: 25px; 
      font-weight: 600;
    }
    .btn-install {
      background: #7B3F52;
      color: #FFF;
      border: none;
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(123, 63, 82, 0.3);
    }
    .btn-install:active { 
      background: #5F2E3E; 
      transform: scale(0.98);
    }
    .ios-tip {
      display: none;
      background: #FFF8E7;
      border: 1px dashed #E0A938;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      color: #7A5800;
      margin-top: 18px;
      line-height: 1.6;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="/icon-192.png" alt="الرجل العنابي" class="logo">
    <h1>تطبيق الرجل العنابي 🛵💨</h1>
    
    <p>
      حمّل يا نجم التطبيق وخليه معاك طول اليوم في أي زنقة.. لو أنت كابتن هتجيب فلوس 💸، ولو أنت زبون هناخد منك الفلوس 😂
    </p>

    <button id="installBtn" class="btn-install">
      <span>📲 ثبّت التطبيق يا باشا</span>
    </button>

    <div id="iosTip" class="ios-tip">
      معاك آيفون يا برنس؟ 🍎 اضغط على زرار المشاركة <strong>(Share)</strong> تحت، واختار <strong>"إضافة إلى الصفحة الرئيسية"</strong> (Add to Home Screen).
    </div>
  </div>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosTip = document.getElementById('iosTip');

    // كشف أجهزة iOS لإظهار الطريقة اليدوية
    const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIos) {
      iosTip.style.display = 'block';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.innerText = 'ألف مبروك.. التطبيق نور شاشتك! 🎉';
        }
        deferredPrompt = null;
      } else if (!isIos) {
        alert('التطبيق نازل عندك يا باشا، أو تقدر تثبته يدوي من الـ 3 نقط اللي فوق في المتصفح 🫡');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
